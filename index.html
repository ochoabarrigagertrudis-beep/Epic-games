<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda de juegos</title>
<style>
:root{color-scheme:dark;--bg:#101014;--p:#202024;--p2:#2a2a30;--tx:#fff;--mu:#a3a3ab;--ac:#0074e4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:var(--bg)}
.top{display:flex;align-items:center;gap:6px;padding:8px 24px;background:#18181c}
.logo{background:#fff;color:#111;font-weight:800;font-size:15px;padding:7px 9px;border-radius:8px;margin-right:10px}
.top.t{background:none;border:0;color:var(--mu);padding:8px 12px;font-size:14px;font-weight:600}
.top.t.on{color:#fff}
.sp{flex:1}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.15)}.btn.g{background:var(--p2)}
.sub{display:flex;align-items:center;gap:18px;padding:12px 24px;flex-wrap:wrap}
.search{background:var(--p2);border:0;border-radius:24px;color:#fff;padding:10px 16px;width:260px;font-size:14px}
.sub nav{display:flex;gap:4px}
.sub nav button,.lk{background:none;border:0;color:var(--mu);padding:8px 12px;font-size:14px;font-weight:600;border-radius:8px}
.sub nav button.on,.sub nav button:hover,.lk:hover{color:#fff;background:var(--p2)}
main{max-width:1240px;margin:0 auto;padding:8px 24px 20px}
.hero{display:grid;grid-template-columns:1fr 210px;gap:14px}
.big{position:relative;height:440px;border-radius:14px;overflow:hidden;cursor:pointer}
.big.info{position:absolute;inset:auto 0 0 0;padding:32px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.big h2{margin:0 0 8px;font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1}
.big p{margin:0 0 6px;color:#e4e4e8;max-width:460px;font-size:15px}
.big.pr{margin:12px 0 16px;font-size:15px}
.big.acts{display:flex;gap:10px;flex-wrap:wrap}
.big.btn{padding:13px 26px}
.big.btn.w{background:rgba(255,255,255,.18)}
.side{display:flex;flex-direction:column;gap:4px}
.side button{flex:1;position:relative;display:flex;gap:12px;align-items:center;background:none;border:0;border-radius:10px;padding:8px 10px;text-align:left;font-size:13px;color:var(--mu);font-weight:600;overflow:hidden}
.side button:hover,.side button.on{background:var(--p2);color:#fff}
.mini{width:38px;height:50px;border-radius:6px;flex:none}
.bar{position:absolute;left:0;bottom:0;height:3px;background:#fff;width:0}
.on.bar{animation:fill 6s linear forwards}
@keyframes fill{to{width:100%}}
h3{margin:38px 0 14px;font-size:20px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:18px}
.card{cursor:pointer;position:relative}
.cover{aspect-ratio:3/4;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px;transition:transform.2s}
.card:hover.cover{transform:translateY(-4px)}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.28),transparent 45%)}
.cover b{position:relative;font-size:22px;line-height:1;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.6);word-break:break-word}
.cover.img b,.cover.img::before{display:none}
.card.g{color:var(--mu);font-size:12px;margin-top:10px}
.card.n{font-size:14px;font-weight:600;margin:2px 0 4px}
.pr{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pr s{color:var(--mu)}
.off{background:var(--ac);padding:2px 6px;border-radius:5px;font-weight:700;font-size:12px}
.heart{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.heart.on{color:#ff4d6d}.cam{right:46px;font-size:13px}
.free{background:var(--p);border-radius:14px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.free.cover{aspect-ratio:16/10;border-radius:12px 12px 0 0}
.strip{background:var(--ac);text-align:center;font-weight:700;font-size:13px;padding:9px;border-radius:0 0 12px 12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#111;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1}
dialog{background:var(--p);color:#fff;border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.8)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;font-size:14px}
.dh span{color:var(--mu)}
canvas{display:block;width:100%;background:#0b0b12;touch-action:none}
footer{text-align:center;color:var(--mu);font-size:12px;padding:30px 20px 40px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.side button{min-width:160px}.big{height:360px}.big h2{font-size:30px}.top.t{display:none}.search{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header>
<div class="top"><div class="logo">TIENDA</div><button class="t on">Tienda</button><button class="t" data-soon>Biblioteca</button><button class="t" data-soon>Ayuda</button><span class="sp"></span><button class="btn g" data-soon>Iniciar sesión</button><button class="btn" data-soon>Descargar</button></div>
<div class="sub"><input class="search" id="q" placeholder="Buscar en la tienda" aria-label="Buscar">
<nav><button class="on">Descubrir</button><button>Explorar</button><button>Noticias</button></nav><span class="sp"></span>
<button class="lk" id="wl">♥ Lista de deseos (<b id="wn">0</b>)</button><button class="lk" data-soon>Carrito</button></div>
</header>
<main>
<section class="hero"><div class="big" id="big"></div><div class="side" id="side"></div></section>
<h3>Juegos gratis</h3><div class="free" id="free"></div>
<h3>Ofertas</h3><div class="row" id="top"></div>
<h3>Todos los juegos</h3><div class="row" id="all"></div>
<p id="none" hidden style="color:var(--mu)">No encontramos juegos con ese nombre.</p>
</main>
<footer>Maqueta de práctica. Toca 📷 en un juego para ponerle su portada.</footer>
<div id="toast" role="status"></div>
<dialog id="dlg"><div class="dh"><b>Fortnite · Demo</b><span>Puntos: <b id="sc">0</b> · Mejor: <b id="bs">0</b></span><button class="btn g" id="cl">Cerrar</button></div>
<canvas id="cv" width="480" height="320"></canvas>
<div class="dh"><span>Mueve el mouse, el dedo o las flechas. Junta amarillos, esquiva rojos.</span></div></dialog>
<script>
// [nombre, precio base, descuento %, color1, color2, género, descripción]
const G=[
["Fortnite",0,0,"#3a0ca3","#4cc9f0","Acción · Battle royale","Construye, sobrevive y gana. Prueba la demo jugable."],
["Rocket League",0,0,"#ff6d00","#023e8a","Deportes · Carreras","Fútbol con autos a toda velocidad."],
["Grand Theft Auto V",29.99,50,"#2d6a4f","#f4a261","Mundo abierto","Tres vidas, una ciudad enorme."],
["Cyberpunk 2077",59.99,65,"#f9e900","#7209b7","RPG · Futurista","Abre camino en Night City."],
["Alan Wake 2",59.99,30,"#10002b","#9d4edd","Terror · Aventura","Una pesadilla entre el bosque y la ciudad."],
["Fall Guys",0,0,"#ff4d8d","#ffd166","Fiesta · Multijugador","Carreras caóticas con 60 jugadores."],
["Hades",24.99,0,"#9d0208","#ffba08","Roguelike","Escapa del inframundo, una y otra vez."],
["Borderlands 3",59.99,80,"#ff9f1c","#2b2d42","Shooter · Cooperativo","Armas, caos y botín sin fin."],
["Control",29.99,75,"#8d0801","#0b090a","Acción · Misterio","Una agencia secreta y un edificio vivo."],
["Death Stranding",39.99,50,"#3d5a80","#e0fbfc","Aventura","Reconecta un mundo roto."],
["Sifu",39.99,40,"#ae2012","#ee9b00","Artes marciales","Un solo maestro, muchos golpes."],
["Celeste",19.99,0,"#7b2cbf","#80ed99","Plataformas","Escala una montaña, enfrenta tus miedos."]];
const $=s=>document.querySelector(s),T=$("#toast"),W=new Set();let tm,cur=0,auto;
function toast(m){T.textContent=m;T.classList.add("show");clearTimeout(tm);tm=setTimeout(()=>T.classList.remove("show"),2200)}
const covers={},slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const bg=i=>covers[i]?`url("${covers[i]}") center/cover`:`linear-gradient(155deg,${G[i][3]},${G[i][4]})`;
const ic=i=>covers[i]?" img":"";
function price(i){const g=G[i];if(!g[1])return"Gratis";if(!g[2])return"$"+g[1].toFixed(2);
return`<span class="off">-${g[2]}%</span><s>$${g[1].toFixed(2)}</s>$${(g[1]*(100-g[2])/100).toFixed(2)}`}
function wish(i,el){W.has(i)?W.delete(i):W.add(i);$("#wn").textContent=W.size;
if(el)el.classList.toggle("on",W.has(i));toast(W.has(i)?"Agregado a tu lista de deseos":"Quitado de tu lista")}
const fi=document.createElement("input");fi.type="file";fi.accept="image/*";let tgt=0;
fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{covers[tgt]=r.result;refresh();toast("Portada actualizada")};r.readAsDataURL(f);fi.value=""};
function refresh(){render($("#q").value.trim().toLowerCase());hero(cur)}
// CARGA AUTOMÁTICA: foto 1.jpg, foto 2.jpg, foto 3.jpg...
G.forEach((g,i)=>{const im=new Image();im.onload=()=>{covers[i]=im.src;refresh()};im.src="foto " + (i+1) + ".jpg"});
function open_(i){i===0?play():toast("Este juego aún no está disponible en la maqueta")}
function card(i){const g=G[i],d=document.createElement("div");d.className="card";
d.innerHTML=`<button class="heart${W.has(i)?" on":""}" aria-label="Lista de deseos">♥</button><button class="heart cam" aria-label="Subir portada">📷</button><div class="cover${ic(i)}" style="background:${bg(i)}"><b>${g[0]}</b></div><div class="g">${g[5]}</div><div class="n">${g[0]}</div><div class="pr">${price(i)}</div>`;
d.onclick=()=>open_(i);
d.querySelector(".cam").onclick=e=>{e.stopPropagation();tgt=i;fi.click()};
d.querySelector(".heart").onclick=e=>{e.stopPropagation();wish(i,e.currentTarget)};return d}
function render(f=""){const L=G.map((g,i)=>i).filter(i=>G[i][0].toLowerCase().includes(f));
$("#all").replaceChildren(...L.map(card));$("#none").hidden=L.length>0;
if(!f){$("#top").replaceChildren(...[2,3,7,8,9].map(card));
$("#free").replaceChildren(...[0,1,5].map(i=>{const d=document.createElement("div");d.className="card";
d.innerHTML=`<div class="cover${ic(i)}" style="background:${bg(i)}"><b>${G[i][0]}</b></div><div class="strip">Gratis ahora</div>`;d.onclick=()=>open_(i);return d}))}}
$("#q").oninput=e=>render(e.target.value.trim().toLowerCase());
const F=[0,3,4,6,2];
function hero(n){cur=n;const i=F[n],g=G[i];$("#big").style.background=bg(i);
$("#big").innerHTML=`<div class="info"><h2>${g[0]}</h2><p>${g[6]}</p><div class="pr big-pr">${price(i)}</div><div class="acts"><button class="btn" data-p>${i===0?"Jugar demo":"Ver juego"}</button><button class="btn w" data-w>♥ Lista de deseos</button></div></div>`;
$("#big").onclick=e=>{if(e.target.closest("[data-w]")){wish(i);return}open_(i)};
$("#side").replaceChildren(...F.map((j,k)=>{const b=document.createElement("button");b.className=k===n?"on":"";
b.innerHTML=`<span class="mini" style="background:${bg(j)}"></span>${G[j][0]}<i class="bar"></i>`;b.onclick=()=>go(k);return b}))}
function go(n){hero(n);clearInterval(auto);auto=setInterval(()=>go((cur+1)%F.length),6000)}
go(0);render();
document.querySelectorAll("[data-soon],.sub nav button").forEach(b=>b.onclick=()=>{
if(b.closest("nav")){document.querySelectorAll(".sub nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}
toast("Función no disponible en esta maqueta")});
$("#wl").onclick=()=>toast(W.size?`Tienes ${W.size} juego(s) en tu lista de deseos`:"Tu lista de deseos está vacía");
/* Juego jugable */
const dlg=$("#dlg"),cv=$("#cv"),x=cv.getContext("2d");let run=false,raf,P,it,sc,best=0,keys={};
function play(){dlg.showModal();start()}
$("#cl").onclick=()=>dlg.close();
dlg.addEventListener("close",()=>{run=false;cancelAnimationFrame(raf)});
function start(){P={x:240,y:285};it=[];sc=0;run=true;$("#sc").textContent=0;loop()}
function mv(cx){const r=cv.getBoundingClientRect();P.x=Math.max(14,Math.min(466,(cx-r.left)*480/r.width))}
cv.addEventListener("pointermove",e=>mv(e.clientX));cv.addEventListener("pointerdown",e=>{if(!run)start();mv(e.clientX)});
addEventListener("keydown",e=>keys[e.key]=1);addEventListener("keyup",e=>keys[e.key]=0);
function loop(){if(!run)return;
if(keys.ArrowLeft)P.x-=6;if(keys.ArrowRight)P.x+=6;P.x=Math.max(14,Math.min(466,P.x));
if(Math.random()<.05+sc/4000)it.push({x:Math.random()*460+10,y:-10,bad:Math.random()<.45,v:2+Math.random()*2+sc/200});
x.fillStyle="#0b0b12";x.fillRect(0,0,480,320);
x.fillStyle="#4cc9f0";x.beginPath();x.arc(P.x,P.y,14,0,7);x.fill();
for(const o of it){o.y+=o.v;x.fillStyle=o.bad?"#ef233c":"#ffd60a";x.beginPath();x.arc(o.x,o.y,o.bad?12:8,0,7);x.fill();
if(Math.hypot(o.x-P.x,o.y-P.y)<(o.bad?24:20)){if(o.bad){run=false;best=Math.max(best,sc);$("#bs").textContent=best;
x.fillStyle="rgba(0,0,0,.7)";x.fillRect(0,0,480,320);x.fillStyle="#fff";x.font="bold 26px sans-serif";x.textAlign="center";x.fillText("Fin del juego · toca para reiniciar",240,165);return}
sc+=10;o.y=999;$("#sc").textContent=sc}}
it=it.filter(o=>o.y<330);raf=requestAnimationFrame(loop)}
</script></body></html>
